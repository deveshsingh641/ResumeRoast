<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="50%" stop-color="#16120E" />
      <stop offset="100%" stop-color="#0C0A08" />
    </linearGradient>

    <!-- Border Gradient with hot ember rim -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5733" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8A3418" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2A1A12" stop-opacity="0.8" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E2D6BE" />
    </linearGradient>

    <!-- Fire Outer (Crimson Roast) -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B81D0B" />
      <stop offset="35%" stop-color="#E8422D" />
      <stop offset="100%" stop-color="#FF5C1C" />
    </linearGradient>

    <!-- Fire Mid (Vibrant Orange Amber) -->
    <linearGradient id="flameMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8422D" />
      <stop offset="40%" stop-color="#FF7800" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>

    <!-- Fire Inner Core (Incandescent Yellow/White) -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="50%" stop-color="#FFD438" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow Filter for Embers -->
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Paper Drop Shadow -->
    <filter id="paperShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle with hot ember rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Internal Fire Glow -->
  <circle cx="32" cy="44" r="22" fill="#E8422D" opacity="0.22" filter="url(#fireGlow)" />
  <circle cx="32" cy="40" r="14" fill="#FFA500" opacity="0.18" />

  <!-- The Resume Paper (Tilted -3 deg for personality & dynamism) -->
  <g transform="rotate(-3 32 32)" filter="url(#paperShadow)">
    <!-- Sheet background with dog-ear fold -->
    <path d="M 17 11 
             L 39 11 
             L 47 19 
             L 47 49 
             C 47 50.8 45.6 52 43.8 52 
             L 20.2 52 
             C 18.4 52 17 50.8 17 49 
             Z" 
          fill="url(#paperGrad)" />

    <!-- Dog-ear fold triangle -->
    <path d="M 39 11 L 39 19 L 47 19 Z" fill="#D8CAB0" />
    <path d="M 39 11 L 39 19 L 47 19 Z" fill="#000000" opacity="0.1" />

    <!-- Resume Header Bar (Stamp Crimson) -->
    <rect x="21" y="16" width="14" height="3" rx="1" fill="#E8422D" />

    <!-- Resume Text Lines (Simulated Bullet Points) -->
    <rect x="21" y="22" width="22" height="2" rx="0.8" fill="#8A8168" opacity="0.75" />
    <rect x="21" y="26.5" width="18" height="2" rx="0.8" fill="#8A8168" opacity="0.75" />
    <rect x="21" y="31" width="21" height="2" rx="0.8" fill="#8A8168" opacity="0.75" />

    <!-- Tiny Red Pen Markup / Roast Strike Line -->
    <line x1="21" y1="27.5" x2="39" y2="27.5" stroke="#E8422D" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

    <!-- Singed / Scorched paper bottom gradient overlay -->
    <path d="M 17 42 C 22 40 28 44 34 39 C 39 42 44 38 47 41 L 47 49 C 47 50.8 45.6 52 43.8 52 L 20.2 52 C 18.4 52 17 50.8 17 49 Z" 
          fill="#3A1C0E" opacity="0.35" />
  </g>

  <!-- ROAST FIRE (Blazing dynamically over the bottom-right of the resume) -->
  <!-- Layer 1: Big Outer Crimson Flame -->
  <path d="M 23 55 
           C 21 47 22 40 27 34 
           C 28 39 30 41 33 37 
           C 35 32 36 21 40 18 
           C 41 24 43 27 46 25 
           C 49 22 48 19 50 16 
           C 51 22 52 30 50 36 
           C 48 42 49 46 51 50 
           C 49 54 44 57 37 57 
           C 30 57 25 56 23 55 Z" 
        fill="url(#flameOuter)" />

  <!-- Layer 2: Mid Golden-Orange Fire Tongue -->
  <path d="M 26 55 
           C 25 48 26 43 30 38 
           C 32 41 34 42 36 39 
           C 38 34 38 27 41 24 
           C 42 29 44 32 46 30 
           C 48 35 48 44 45 49 
           C 42 54 36 56 31 56 
           C 28 56 27 55.5 26 55 Z" 
        fill="url(#flameMid)" />

  <!-- Layer 3: Hot Intense Core (Yellow-to-White Center) -->
  <path d="M 30 55 
           C 29 50 30 46 33 42 
           C 35 44 37 45 38 41 
           C 40 37 40 32 42 29 
           C 43 33 45 36 45 41 
           C 45 47 43 52 39 54 
           C 35 56 32 55.5 30 55 Z" 
        fill="url(#flameInner)" />

  <!-- Floating Glowing Roast Sparks & Embers -->
  <circle cx="15" cy="24" r="1.3" fill="#FFB93C" filter="url(#fireGlow)" />
  <circle cx="20" cy="14" r="1.1" fill="#FF7800" />
  <circle cx="53" cy="21" r="1.4" fill="#FFB93C" filter="url(#fireGlow)" />
  <circle cx="48" cy="11" r="1" fill="#FFAE00" />
  <circle cx="37" cy="11" r="0.9" fill="#FFDE59" />
</svg>